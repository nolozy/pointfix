<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Indigo (#6366f1) to Pink (#ec4899) at 45 degrees -->
    <linearGradient id="pointfixGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Rounded Square Background (Radius: 28) -->
  <rect x="0" y="0" width="128" height="128" rx="28" ry="28" fill="url(#pointfixGradient)"/>

  <!-- Main Pointer Arrow / Cursor Shape -->
  <!-- Bold, simple geometry optimized for visibility down to 16x16 px -->
  <path d="M34 26 
           L34 94 
           L53 76 
           L68 102 
           L81 94 
           L66 69 
           L94 69 
           Z" 
        fill="#ffffff" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linejoin="round" 
        stroke-linecap="round"/>

  <!-- Target Marker / Pin Base (White Border Ring) -->
  <circle cx="34" cy="26" r="18" fill="#ffffff"/>

  <!-- Number Pin (Amber Circle inside White Border at Pointer Tip) -->
  <circle cx="34" cy="26" r="13" fill="#f59e0b"/>

  <!-- Center Pin Dot (Visual Accent simulating pin core) -->
  <circle cx="34" cy="26" r="5" fill="#ffffff"/>
</svg>