<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Indigo (#6366f1) to Pink (#ec4899) at 45 degrees -->
    <linearGradient id="pointfixGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Rounded Square Background (Radius: 28) -->
  <rect x="0" y="0" width="128" height="128" rx="28" ry="28" fill="url(#pointfixGradient)"/>

  <!-- Main Centered Large Pointer Arrow -->
  <path d="M42 22 
           L42 102 
           L64 80 
           L81 108 
           L95 99 
           L78 71 
           L108 71 
           Z" 
        fill="#ffffff" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linejoin="round" 
        stroke-linecap="round"/>
</svg>